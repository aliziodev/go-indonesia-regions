name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (go ${{ matrix.go }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # The oldest supported release and the current one. Anything in
        # between is covered by compatibility promises.
        go: ['1.23', 'stable']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # The race detector needs cgo and a C toolchain, which is dependable on
      # the Linux runners and fiddly on Windows.
      - name: Test with the race detector
        if: runner.os == 'Linux'
        run: go test -race ./...

  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-ed:"
            echo "$unformatted"
            exit 1
          fi

      - name: Staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false

  fuzz:
    name: fuzz (smoke)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      # A short run on every push is enough to catch a regression in code
      # parsing; the corpus keeps whatever it finds.
      - name: Fuzz code parsing
        run: go test -run=XXX -fuzz=FuzzLevelOf -fuzztime=60s .
